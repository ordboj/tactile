    <path id="walker-shape" fill="#FFE566" stroke="#14110E" stroke-width="8" stroke-linejoin="round" d="M68 20C68 20 116 64 116 100C116 130 94 148 68 148C42 148 20 130 20 100C20 64 68 20 68 20Z"/>
